<head>
  <title>Create a new account</title>
  <link rel="stylesheet" href="newAccount.css" />
</head>
<body>
  <div class="container">
    <div class="title">
      <h4>Create a new Account</h4>
    </div>

    <div class="input">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />
    </div>

    <div class="input">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
    </div>

    <div class="input">
        <label for="address">Address</label>
        <input type="address" id="address" placeholder="Enter your address" required />
    </div>

    <button class="button-34" id="Confirm">Confirm</button>
   

    <div class="p">
      <p>By logging in, you agree to our terms and policies.</p>
    </div>
  </div>

  <script src="./dist/CreateAccount.js"></script>
</body>
</html>
